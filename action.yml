# action.yml — review-pantheon as a published GitHub Action.
#
# The zero-footprint install: a target repo's whole integration is the ~20-line workflow stub
# at examples/review-gate.yml (Way C) — nothing is copied into the target repo. install.sh's Way
# A generates a comparably thin caller of this same file (issue #36 — it used to vendor a whole
# second ~1,000-line reimplementation instead; that duplicate is gone). Every file this action
# reads at run time — its bundled personas, the pantheon package (whose `pantheon.verdict`
# module decides every verdict — the one implementation every lane calls), action/lib/*.sh, the
# JSON schema below — is read from `${{ github.action_path }}` (with the one opt-in exception
# documented a few paragraphs down: the `personas_path` input, base-pinned from the consuming
# repo's base commit), i.e.
# review-pantheon's own checkout as GitHub Actions pulls it for the `uses:` reference (run via
# `PYTHONPATH="$ACTION_PATH" python3 "$ACTION_PATH/pantheon/verdict.py"`
# — a `pip install` is not needed, a stdlib-only package runs straight from its own checkout).
#
# Deliberately NOT `python3 -m pantheon.verdict` (a Codex P1 finding on this port's own PR): `-m`
# prepends the CURRENT WORKING DIRECTORY to sys.path[0] — BEFORE any PYTHONPATH entry — and every
# step here runs with the CONSUMING repo's checkout as cwd (the default working-directory for a
# composite-action step, never overridden below). A fork PR that commits its own top-level
# `pantheon/verdict.py` would get that file imported instead of the trusted one at
# `github.action_path`, forging its own verdict — the identical shadow class
# `pantheon.execution.resolve_console_script`'s own three-round fix history already closes for
# the readonly-tier wrapper invocation (see that function's docstring). Invoking the trusted
# `verdict.py` by its own absolute path instead of via `-m` closes it the same way a resolved
# console script does: the script's OWN directory becomes sys.path[0], never the caller's cwd —
# verified live against a reproduction (a same-named `pantheon/verdict.py` planted in a
# hostile-checkout-shaped cwd) before landing this fix.
#
# Not from the calling repo. The one opt-in exception is the
# `personas_path` input (a consuming workflow author pointing this action at a repo-local
# persona fork instead) — that content is base-pinned from the PR's base commit via `git show`
# (see the "Resolve gate configuration" step and the input's own description below), never read
# from the calling repo's checked-out working tree, for the same fork-PR-injection reason
# REVIEW_RULES.md/DESIGN.md are (DESIGN.md's "Security posture").
#
# anthropics/claude-code-action is pinned below to a real, verified commit SHA — v1.0.191,
# tag `v1.0.191` (the `v1` tag also currently resolves to this same commit; pin the full SHA,
# not a tag, since tags on that repo move):
#   https://github.com/anthropics/claude-code-action/releases/tag/v1.0.191
#   SHA: 239e3a730883eeb5c53db12b0fc9573b3024b126
# Verified by reading that release's actual action.yml directly (not assumed from memory or an
# older version's docs):
#   https://raw.githubusercontent.com/anthropics/claude-code-action/239e3a730883eeb5c53db12b0fc9573b3024b126/action.yml
# against that repo's own migration guide for what changed in its v1.0 rewrite:
#   https://github.com/anthropics/claude-code-action/blob/main/docs/migration-guide.md
# Confirmed real names (all four of our prior guesses needed correcting — see git history for
# what they were before this file existed):
#   - auth inputs: `claude_code_oauth_token` and `anthropic_api_key` (both optional; exactly
#     one must be set) — these two guesses were correct.
#   - prompt input: `prompt` — correct as guessed.
#   - tool allowlist: NOT an `allowed_tools` input (that was a v0.x input, removed in v1) — it's
#     now `--allowedTools` inside the free-form `claude_args` input (CLI-flag passthrough).
#   - result output: there is NO `result` output in v1 (the whole v0.x "read raw text output"
#     model is gone). v1's outputs are `execution_file`, `branch_name`, `github_token`,
#     `structured_output`, `session_id`. This action uses `structured_output`, populated by
#     passing `--json-schema '<schema>'` in `claude_args` — see
#     https://github.com/anthropics/claude-code-action/blob/239e3a730883eeb5c53db12b0fc9573b3024b126/docs/usage.md#structured-outputs.
#     This is a materially better mechanism than the old "extract trailing JSON from raw text"
#     approach the now-deleted vendored action/review.yml used to rely on (issue #36) — the
#     schema is enforced by the upstream action itself, not just hoped for in a persona's
#     closing instructions.
#
# Composite-action constraints (verified against GitHub's own docs, not assumed):
#   - No `strategy`/`matrix` inside a composite action — that's a job-level-only concept. A
#     composite action's `runs.steps` is a static list; it cannot loop dynamically over a
#     runtime input (this `agents` input is a string, "artemis apollo" by default, evaluated
#     at run time — there is no way to turn that into N `uses:` steps). The five possible
#     agents (agents/*.md — the fixed, bundled persona set) are therefore unrolled into five
#     static build/run/decide step trios below, each gated by `if: contains(inputs.agents,
#     '<name>')`. That's structural duplication (GitHub Actions leaves no alternative for a
#     `uses:` step specifically), not logic duplication — the logic each trio shares
#     (prompt-building, verdict-deciding) lives once in action/lib/*.sh and `pantheon.verdict`
#     (the one implementation this file calls, invoked five times with different arguments, not
#     five times hand-written).
#   - Every agent here runs SEQUENTIALLY in one job, not as parallel matrix legs — a composite
#     action can't use `strategy`/`matrix` at all (see above), so there is no way to run agents
#     as concurrent matrix legs the way the now-deleted vendored action/review.yml's
#     artemis/apollo pair used to (issue #36). Simplicity over parallelism: one job means the
#     per-agent decide steps' outputs are readable directly via `steps.<id>.outputs` by the
#     final combine step in the SAME job — no cross-job artifact upload/download round-trip. The
#     cost is wall-clock: N agents run one after another, not concurrently. Given the default
#     panel is two agents and this action targets whoever wants the simplest possible install,
#     that tradeoff was made deliberately — parallelizing multiple agents inside one composite
#     action isn't achievable without job-boundary machinery a composite action structurally
#     cannot have, and this action's whole point is not requiring the target repo to maintain
#     that machinery itself.
#   - `steps.<id>.outcome` inside a composite action's own conditionals was historically broken
#     (always empty — actions/runner#1578) but was fixed via actions/runner#1600; current
#     runner versions support it, and `if: always()` on later composite steps behaves the same
#     as job-level `always()`. This action still avoids leaning on that where a simpler
#     mechanism exists: `continue-on-error: true` on the `uses:` and `decide` steps (rather than
#     relying on always()-chains) is enough to guarantee the combine/enforce steps always run,
#     because a `continue-on-error` step never marks the composite action itself as failed in
#     the first place, so there's nothing for a later step to have to survive.
#   - This action does NOT declare `permissions:` — composite actions can't; the CALLING job
#     must grant `contents: read` (for its own checkout) and `pull-requests: write` (for the
#     combined comment this action posts). See examples/review-gate.yml.
#   - This action does NOT check out the target repo itself — the caller must, with enough
#     `fetch-depth` for `git diff <base>...<head>` to resolve (fetch-depth: 0 is simplest). See
#     examples/review-gate.yml.
#   - Draft-PR skipping is NOT implemented inside this action — it can't be: whether the job
#     that invokes this action runs at all is decided by the CALLING workflow's job-level `if:`,
#     before this action ever starts (same reason review.yml's own draft skip is a job `if:`,
#     not something inside the matrix steps). See examples/review-gate.yml's `if:`.
#   - Docs-only Apollo skip IS implemented inside this action (it needs the diff, which this
#     action already computes) — same behavior as review.yml's, loud 🟡 skip, no Apollo run.
#
# Honest limitation: this action can't be integration-tested end-to-end (a real `uses:
# G-Schumacher44/review-pantheon@v1` against a real PR) until this repo is public on GitHub —
# see DESIGN.md's "Published action" section. `.github/workflows/ci.yml`'s
# `composite-action-self-check` job covers what CAN be verified without that: the YAML parses,
# every file this action references under `github.action_path` actually exists, and the
# embedded shell passes `bash -n`/shellcheck (already true via the repo-wide shellcheck job).

name: "review-pantheon gate"
description: >-
  Fail-closed AI review gate — Artemis/Apollo twins on every PR. Read-only, blocker-invariant,
  zero files in your repo.
branding:
  icon: shield
  color: blue

inputs:
  claude_code_oauth_token:
    description: >-
      Claude Code OAuth token (alternative to anthropic_api_key). Set exactly one of the two
      auth inputs — this action fails loud if both or neither are set.
    required: false
  anthropic_api_key:
    description: >-
      Anthropic API key (alternative to claude_code_oauth_token). Set exactly one of the two
      auth inputs — this action fails loud if both or neither are set.
    required: false
  github_token:
    description: >-
      GitHub token claude-code-action uses for its GitHub API access; defaults to the workflow
      token, which avoids any need for id-token: write permissions.
    required: false
    default: ${{ github.token }}
  agents:
    description: >-
      Space-separated personas to run, drawn from: artemis apollo socrates diogenes plato
      (agents/*.md in this repo — the fixed, bundled set). Default is the standard two-agent
      gate. Adding a counsel agent (socrates/diogenes/plato) here runs it as an enforcing gate
      leg like the twins, which DESIGN.md calls the exception, not their normal home — see
      DESIGN.md's "The idea" section before doing that on every PR.
    required: false
    default: "artemis apollo"
  personas_path:
    description: >-
      Directory of persona .md files to use INSTEAD of the ones bundled with this action,
      relative to the target repo (e.g. ".github/review-agents"). Leave unset to use the
      bundled personas at this action's own agents/ directory. When set, content is resolved
      from the PR's BASE commit (base-pinned, like REVIEW_RULES.md/DESIGN.md below), never from
      the checked-out working tree — see DESIGN.md's "Security posture".
    required: false
    default: ""
  rules_file:
    description: >-
      House-rules file, relative to the checked-out target repo. Only read if it's actually
      present there — a target repo that never created one just doesn't get house-rule checks.
    required: false
    default: "REVIEW_RULES.md"
  spec_file:
    description: >-
      Governing design/spec doc, relative to the checked-out target repo. Only used if it's
      actually present there (same only-if-exists semantics as rules_file). When present, only
      Apollo's prompt gets a pointer to it plus an instruction to check the delivered change
      against it — every other agent's prompt is unaffected. A repo with no spec file gets
      today's behavior unchanged.
    required: false
    default: "DESIGN.md"
  model:
    description: >-
      Optional Claude model id, passed through to every agent invocation as claude_args'
      `--model`. Leave unset for anthropics/claude-code-action's own default.
    required: false
    default: ""
  post_comment:
    description: >-
      Post one combined PR comment. Set to "false" to only compute verdicts and print the
      would-be comment to the step log without posting — this action's own exit status still
      reflects the gate result (fails on red/unverified) either way.
    required: false
    default: "true"
  execution:
    description: >-
      Tool-execution tier for every underlying claude-code-action invocation: "readonly" (the
      default) restricts Bash to a read-only git allowlist (diff/show/log/status) — Read/Grep/
      Glob stay unrestricted, they're already read-only by nature. Reviewing a PR diff is
      reviewing content that's 100% attacker-controlled on a fork, so this is the mechanical
      backstop behind the personas' own "read-only" instructions (which prompt injection can
      defeat, being prose). "trusted" restores full Bash, the pre-existing behavior — reserve it
      for own-repo/trusted-author use only, never for reviewing a fork PR you don't control. See
      DESIGN.md's "Security posture".
    required: false
    default: "readonly"

runs:
  using: "composite"
  steps:
    # CRITICAL finding + resolution history (adversarial review, round 8, live Artemis blocker on
    # this PR's own self-hosted gate — then a round-9 P2 correction on the fix itself; keep this
    # whole history, not just the final state, since a future maintainer re-deriving "why is there
    # no scrub step here" needs the full path, not just the ending):
    #
    # CRITICAL-1's original fix (neutral cwd + conditional --bare) only ever covered the CLI
    # (Python) lane — this composite action's own five `uses: anthropics/claude-code-action` steps
    # (below) still ran with cwd at the checked-out PR's own working tree, no neutral relocation
    # available (a `uses:` step can't take a working-directory override the way this action's own
    # shell steps can). The identical config/MCP/hooks startup auto-discovery vector CRITICAL-1
    # closed on the CLI lane was open here — on the lane this repo actually recommends for
    # fork-PR review, with the job's own github_token/CLAUDE_CODE_OAUTH_TOKEN in scope. Worst
    # case: RCE on the runner via a PR-committed `.mcp.json` MCP server or `.claude/settings.json`
    # hook, before this action's own `--allowedTools` scoping is ever consulted.
    #
    # Round 8's first fix: a hand-rolled `rm -rf .mcp.json .claude CLAUDE.md` step here, plus
    # unconditional `--bare` in claude_args below. Two bugs surfaced live, in order:
    #   1. `--bare` broke `--json-schema`-driven structured output on this Action lane
    #      specifically — a live self-hosted-gate run failed both agents to UNVERIFIED with
    #      `##[error]--json-schema was provided but Claude did not return structured_output.
    #      Result subtype: success`. Reverted (not present in claude_args below) — see that
    #      step's own comment for why the CLI (Python) lane's own `--bare` is unaffected and
    #      unrelated.
    #   2. The `rm -rf` scrub step itself was DESTRUCTIVE to a CONSUMING repo's own workspace: any
    #      repo that legitimately tracks `.claude/`/`CLAUDE.md`/`.mcp.json` and runs build/test/
    #      deploy steps AFTER this action in the SAME job would find those files permanently
    #      deleted — destroying adopter content as a side effect of reviewing a PR, the exact
    #      opposite of this action's own "nothing is copied into the target repo" zero-footprint
    #      promise. A P2 finding, correctly flagged as more serious than its badge.
    #
    # Round 9's fix: REMOVED the scrub step entirely — investigating `anthropics/claude-code-
    # action`'s own source at this file's pinned SHA (originally verified at v1.0.183's
    # be7b93b19..., RE-VERIFIED verbatim at v1.0.191's 239e3a730... when the pin was refreshed —
    # a pin bump must re-check this, since the scrub's removal is only safe while upstream
    # mitigates natively) found it already has an UNCONDITIONAL, NATIVE mitigation for this
    # identical vector: `src/entrypoints/run.ts` (that SHA), inside its own `Phase 3: Run Claude` block,
    # gated only on `isEntityContext(context) && context.isPR` (true for every PR-triggered run,
    # not behind any input/config this workflow controls) —
    #
    #   // On PRs, .claude/ and .mcp.json in the checkout are attacker-controlled.
    #   // Restore them from the base branch before the CLI reads them.
    #   ...
    #   restoreConfigFromBase(restoreBase);
    #
    # `restoreConfigFromBase` (`src/github/operations/restore-config.ts`, same SHA) snapshots the
    # PR's own sensitive-path content into `.claude-pr/` first (so a review agent can still
    # inspect what the PR changed, without ever executing it), THEN deletes the working-tree
    # versions, fetches the PR's base branch, and `git checkout`s each sensitive path
    # (`.claude`, `.mcp.json`, `.claude.json`, `.gitmodules`, `.ripgreprc`, `CLAUDE.md`,
    # `CLAUDE.local.md`, `.husky`) from that trusted ref — BEFORE the CLI's own startup ever
    # reads any of them. This is the SAME class of protection the round-8 scrub step tried to add
    # by hand, already shipped natively, and confirmed FIRING in this repo's own live self-check
    # run (the exact console line, verbatim): `Restoring .claude, .mcp.json, .claude.json,
    # .gitmodules, .ripgreprc, CLAUDE.md, CLAUDE.local.md, .husky from origin/dev (PR head is
    # untrusted)`.
    #
    # Net result: no code of THIS repo's own mutates the consuming workspace for this vector at
    # all — the safest possible fix (option (b) from the round-9 finding: "don't mutate the
    # workspace... if the vector can be closed by pointing the provider's config/discovery at a
    # controlled location instead of deleting the workspace's, do that" — here, the underlying
    # tool already does exactly that, verified against its own pinned source AND a live run, not
    # assumed). **Do not re-add a scrub step here** — it would be both redundant with an
    # already-shipped native protection and, if implemented destructively again, would reopen
    # the exact adopter-data-loss bug round 9 closed. If `claude-code-action`'s pin above is ever
    # bumped, re-verify `restoreConfigFromBase`'s call site still exists and is still
    # unconditional for PR events before assuming this protection still holds.
    - name: Assert exactly one auth input is set
      id: auth
      shell: bash
      env:
        OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        API_KEY: ${{ inputs.anthropic_api_key }}
        # Gated on the event: off a pull_request, `github.event.pull_request` is null, so a bare
        # inequality would report "this PR is from a fork" on a push/workflow_dispatch run with a
        # genuinely missing secret — the same false diagnosis this whole change removes.
        IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        set -euo pipefail
        if [ -n "$OAUTH_TOKEN" ] && [ -n "$API_KEY" ]; then
          echo "::error::review-pantheon: set exactly one of claude_code_oauth_token / anthropic_api_key inputs, not both."
          exit 1
        fi
        if [ -z "$OAUTH_TOKEN" ] && [ -z "$API_KEY" ]; then
          # A FORK PR IS NOT A MISCONFIGURATION — say which one this is.
          #
          # GitHub withholds `secrets.*` from a `pull_request` run originating in a fork, on
          # purpose: the PR's own code runs in that job, so an available credential would be a
          # stranger's for the taking. The caller's secrets input therefore arrives here as
          # the empty string, and no provider call is possible.
          #
          # Reporting that as "you forgot to set a secret" is simply false, and it sent every
          # fork contributor looking for a setting the maintainer had already configured. The
          # gate now names the real cause and, on a fork, exits 0 rather than pinning a
          # permanently-red required check to a PR nobody can turn green.
          #
          # It is NOT a pass. The step summary says NOT GATED in as many words, because the one
          # dangerous reading of a green check is "this was reviewed".
          #
          # NEVER "fix" this with `pull_request_target` — see SECURITY.md's "Fork pull requests".
          if [ "$IS_FORK" = "true" ]; then
            echo "::notice::review-pantheon: NOT GATED — this PR is from a fork, and GitHub withholds repository secrets from fork runs by design, so there is no credential to review with. Expected, not a misconfiguration. The PR has NOT been reviewed; review it manually."
            {
              echo "### ⚠️ review-pantheon: NOT GATED (fork pull request)"
              echo
              echo "GitHub withholds repository secrets from fork runs by design, so the gate had"
              echo "no credential to authenticate with."
              echo
              echo "**This PR has not been reviewed by Artemis or Apollo.** A green check here means"
              echo "the gate skipped, not that the change passed. Review it manually before merging."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "gated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::review-pantheon: set one of claude_code_oauth_token / anthropic_api_key — the gate fails loud, it does not skip."
          exit 1
        fi
        echo "gated=true" >> "$GITHUB_OUTPUT"

    # PR metadata is attacker-controlled on forks (DESIGN.md's "Security posture") — validated
    # before it touches any shell command, same posture as the CLI lane's PR-number/branch-name/
    # head-SHA checks in `pantheon.cli`. BASE_SHA specifically feeds `git show`/`git diff`
    # below (the Resolve-gate-configuration step's base-pinned rules/spec reads, and the
    # Detect-docs-only-diff step) — both runs BEFORE this fix validated it. Runs before every
    # step that touches either SHA in a shell command; a failure here fails the whole composite
    # action closed (no continue-on-error on this step) before anything downstream executes.
    - name: Validate PR base/head SHAs
      if: ${{ steps.auth.outputs.gated != 'false' }}
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        SHA_RE='^[0-9a-f]{7,40}$'
        if ! [[ "$BASE_SHA" =~ $SHA_RE ]]; then
          echo "::error::review-pantheon: unsafe base SHA '$BASE_SHA' from PR event context — UNVERIFIED, refusing to use it in any git command."
          exit 1
        fi
        if ! [[ "$HEAD_SHA" =~ $SHA_RE ]]; then
          echo "::error::review-pantheon: unsafe head SHA '$HEAD_SHA' from PR event context — UNVERIFIED, refusing to use it in any git command."
          exit 1
        fi

    - name: Resolve gate configuration
      id: resolve
      if: ${{ steps.auth.outputs.gated != 'false' }}
      shell: bash
      env:
        PERSONAS_PATH: ${{ inputs.personas_path }}
        RULES_FILE: ${{ inputs.rules_file }}
        SPEC_FILE: ${{ inputs.spec_file }}
        MODEL: ${{ inputs.model }}
        EXECUTION: ${{ inputs.execution }}
        ACTION_PATH: ${{ github.action_path }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail

        # pantheon_base_pinned_read (issue #6, round-2 Codex P2 finding) — symlink-safe
        # base-pinned reads (see pantheon/basepin.py's own docstring for the full contract).
        # Invoked via its OWN ABSOLUTE PATH at this action's own trusted checkout
        # ($ACTION_PATH), deliberately NOT `python3 -m pantheon.basepin` — the identical
        # `-m`-prepends-cwd-to-sys.path shadow vector `pantheon.verdict`'s own invocation below
        # closes the same way (see the "Decide verdict" steps' comments). PYTHONPATH supplies
        # $ACTION_PATH so basepin.py's own `from pantheon import execution` resolves.
        pantheon_base_pinned_read() {
          PYTHONPATH="$ACTION_PATH" python3 "$ACTION_PATH/pantheon/basepin.py" read "$@"
        }

        # Tiered execution (HIGH-1 fix — see the `execution` input's own description and
        # DESIGN.md's "Security posture"). Fail loud on an unrecognized value rather than
        # silently coercing to a guess — this is a security default, same posture as the
        # auth-input assertion step above.
        #
        # readonly is routed through pantheon/execution.py's `wrapper` CLI (this action's own
        # checkout at $ACTION_PATH — no vendoring needed), not a bare `Bash(git diff *)`-style
        # prefix pattern: a prefix match can't tell a read-only git
        # subcommand from the same subcommand carrying a writing/execution-capable flag
        # (`--output=`, `--ext-diff`) — a real Codex finding on this PR. See that module's own
        # docstring for the finding this closes. Invoked by its OWN ABSOLUTE PATH (never
        # `python3 -m pantheon.execution wrapper`, which would let a PR-committed
        # `pantheon/execution.py` shadow the trusted one via the cwd-prepend vector) — the
        # literal string below is what the model must type verbatim to match
        # `Bash($GIT_WRAPPER *)`, so no PYTHONPATH is embedded in it (execution.py imports
        # nothing from the `pantheon` package itself).
        GIT_WRAPPER="python3 $ACTION_PATH/pantheon/execution.py wrapper"
        case "$EXECUTION" in
          readonly)
            ALLOWED_TOOLS="Read,Grep,Glob,Bash($GIT_WRAPPER *)"
            ;;
          trusted)
            ALLOWED_TOOLS='Read,Grep,Glob,Bash'
            ;;
          *)
            echo "::error::review-pantheon: unknown execution tier '$EXECUTION' (must be 'readonly' or 'trusted')"
            exit 1
            ;;
        esac
        echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"
        echo "git_wrapper_path=$GIT_WRAPPER" >> "$GITHUB_OUTPUT"

        if [ -z "$PERSONAS_PATH" ]; then
          PERSONAS_DIR="$ACTION_PATH/agents"
        else
          # personas_path opts a consuming workflow into reading persona content from the
          # TARGET repo instead of this action's own trusted checkout at $ACTION_PATH — that
          # puts it in exactly the same PR-controlled-checkout trust boundary as
          # REVIEW_RULES.md/DESIGN.md above (issue #6's class statement, DESIGN.md's "Security
          # posture"): a fork PR's own head can edit a file at that path, and the working tree
          # ($GITHUB_WORKSPACE) at review time IS that fork PR's content. Base-pinned the same
          # way: resolve each of the five fixed persona names from the PR's BASE commit via
          # pantheon_base_pinned_read (sourced above), into $RUNNER_TEMP, never $GITHUB_WORKSPACE.
          # A persona absent at base (e.g. only introduced by this PR's own head) is simply not
          # written — build_prompt.sh already fails loud per-agent on a missing persona file, the
          # same behavior a bundled-personas install already has for an unsupported agent name.
          # Routed through pantheon_base_pinned_read rather than a bare `git show` so a
          # SYMLINKED custom persona (a real, legitimate pattern — e.g.
          # `.github/custom-personas/artemis.md -> ../../agents/artemis.md`) resolves to its
          # target's content instead of git show's raw link-target pathname on a mode-120000
          # blob (round-2 Codex P2 finding on this repo's own PR #8, the same class this whole
          # input closes). Its return codes are distinct: 2 is ordinary absence (this persona
          # just isn't provided under personas_path, handled below the same as before); 1 is a
          # REFUSED resolution (an escaping or pathologically deep symlink chain) and must never
          # be silently treated as absence — it fails the whole run loud.
          PERSONAS_DIR="$RUNNER_TEMP/pantheon-personas"
          mkdir -p "$PERSONAS_DIR"
          any_persona_resolved=false
          for persona_name in artemis apollo socrates diogenes plato; do
            persona_rc=0
            pantheon_base_pinned_read "$BASE_SHA" "${PERSONAS_PATH}/${persona_name}.md" "$PERSONAS_DIR/${persona_name}.md" || persona_rc=$?
            case "$persona_rc" in
              0) any_persona_resolved=true ;;
              1)
                echo "::error::review-pantheon: refused to resolve persona '$persona_name' under personas_path '$PERSONAS_PATH' at base $BASE_SHA — see the ::error:: line above (a symlink escaping the repository, or a chain exceeding the depth bound)."
                exit 1
                ;;
              *) rm -f "$PERSONAS_DIR/${persona_name}.md" ;;
            esac
          done
          if [ "$any_persona_resolved" != "true" ]; then
            echo "::error::review-pantheon: personas_path '$PERSONAS_PATH' has no persona file resolvable at the PR's base commit (${BASE_SHA}) — checked for artemis/apollo/socrates/diogenes/plato.md there. A file that exists only on this PR's own head is refused by design (base-pinning) — see DESIGN.md's 'Security posture'. If this is the PR that first adds these files, merge it via another path first, then personas_path will resolve normally on every PR after it."
            exit 1
          fi
        fi
        [ -d "$PERSONAS_DIR" ] || { echo "::error::review-pantheon: personas directory not found: $PERSONAS_DIR (check the personas_path input)"; exit 1; }
        echo "personas_dir=$PERSONAS_DIR" >> "$GITHUB_OUTPUT"

        # Rules/spec files are read from the PR's BASE commit via pantheon_base_pinned_read
        # (sourced above; symlink-safe — see that file's header and issue #6's round-2 Codex P2
        # finding), never the checked-out working tree — on a fork PR the working tree holds the
        # PR author's own (attacker-controlled) head content, and a rules/spec file read from
        # there would be prompt-injectable by whoever opened the PR. A file that only exists on
        # head (the PR itself adds or edits it) is never read; if it's absent at base (return
        # code 2 — ordinary absence), this falls back to omitting it — see DESIGN.md's "Security
        # posture" — "Base-SHA-pinned context file reads" — and action/lib/build_prompt.sh's
        # per-agent handling of rules_present/spec_present below for the loud-vs-silent
        # distinction between the two. A REFUSED resolution (return code 1 — an escaping or
        # pathologically deep symlink chain) is never folded into that same silent-absence path;
        # it fails the whole run loud instead.
        #
        # Content travels to the build-prompt steps as a FILE PATH under $RUNNER_TEMP, never as
        # an env var or a GITHUB_OUTPUT value carrying the raw content — a large base spec/rules
        # file blew past the OS's per-step environment size limit ("Argument list too long")
        # when it was passed as an env var, which killed the whole build-prompt step (and, since
        # that step isn't continue-on-error, the entire gate run and its combined comment) before
        # build_prompt.sh ever ran. A file has no such ceiling. Every downstream build-prompt
        # step reads RULES_CONTENT_PATH/SPEC_CONTENT_PATH from this step's outputs and cats the
        # file itself (action/lib/build_prompt.sh) — this is the only place in this repo that
        # carries pinned file content across a GitHub Actions step boundary.
        RULES_CONTENT_FILE="$RUNNER_TEMP/pantheon-rules-content.txt"
        : > "$RULES_CONTENT_FILE"
        rules_rc=0
        if [ -n "$RULES_FILE" ]; then
          pantheon_base_pinned_read "$BASE_SHA" "$RULES_FILE" "$RULES_CONTENT_FILE" || rules_rc=$?
        else
          rules_rc=2
        fi
        case "$rules_rc" in
          0) echo "rules_present=true" >> "$GITHUB_OUTPUT" ;;
          2) : > "$RULES_CONTENT_FILE"; echo "rules_present=false" >> "$GITHUB_OUTPUT" ;;
          *)
            echo "::error::review-pantheon: refused to resolve $RULES_FILE at base $BASE_SHA — see the ::error:: line above (a symlink escaping the repository, or a chain exceeding the depth bound)."
            exit 1
            ;;
        esac
        echo "rules_file=$RULES_FILE" >> "$GITHUB_OUTPUT"
        echo "rules_content_path=$RULES_CONTENT_FILE" >> "$GITHUB_OUTPUT"

        SPEC_CONTENT_FILE="$RUNNER_TEMP/pantheon-spec-content.txt"
        : > "$SPEC_CONTENT_FILE"
        spec_rc=0
        if [ -n "$SPEC_FILE" ]; then
          pantheon_base_pinned_read "$BASE_SHA" "$SPEC_FILE" "$SPEC_CONTENT_FILE" || spec_rc=$?
        else
          spec_rc=2
        fi
        case "$spec_rc" in
          0) echo "spec_present=true" >> "$GITHUB_OUTPUT" ;;
          2) : > "$SPEC_CONTENT_FILE"; echo "spec_present=false" >> "$GITHUB_OUTPUT" ;;
          *)
            echo "::error::review-pantheon: refused to resolve $SPEC_FILE at base $BASE_SHA — see the ::error:: line above (a symlink escaping the repository, or a chain exceeding the depth bound)."
            exit 1
            ;;
        esac
        echo "spec_file=$SPEC_FILE" >> "$GITHUB_OUTPUT"
        echo "spec_content_path=$SPEC_CONTENT_FILE" >> "$GITHUB_OUTPUT"

        # The verdict-contract JSON schema (DESIGN.md's "Verdict contract") — structural only,
        # deliberately NOT enforcing each agent's own verdict vocabulary here (that would be a
        # SECOND copy of the vocab->color rule alongside `pantheon.verdict`, the one place that
        # rule lives). One schema shared by every agent, computed once — DERIVED at runtime from
        # `pantheon.providers.VERDICT_JSON_SCHEMA` (issue #32) rather than hand-copied here as a
        # second string literal. There is now exactly ONE copy of the schema text in this repo —
        # that module constant — so the two surfaces cannot drift apart; the byte-identity test
        # #28 added now asserts this derivation actually runs and matches, instead of comparing
        # two hand-maintained copies (tests/test_providers.py).
        #
        # The subshell `cd "$ACTION_PATH"` is load-bearing, not style (Codex P1 on this fix's own
        # PR): `python3 -c` puts the CURRENT WORKING DIRECTORY at sys.path[0], AHEAD of anything
        # PYTHONPATH supplies — and this step's cwd is the CONSUMING repo's checkout, so a PR
        # committing a top-level `pantheon/providers.py` would have its copy imported instead of
        # the trusted one: the same cwd-shadow class this file's header documents closing for the
        # decider (which dodges it by absolute-script-path invocation). Pinning cwd to the
        # action's own checkout makes sys.path[0] resolve against trusted content by
        # construction; the cd is scoped to the command substitution and does not move the step.
        JSON_SCHEMA="$(cd "$ACTION_PATH" && PYTHONPATH="$ACTION_PATH" python3 -c 'from pantheon.providers import VERDICT_JSON_SCHEMA; print(VERDICT_JSON_SCHEMA)')" || {
          echo "::error::review-pantheon: failed to derive the verdict JSON schema from pantheon.providers.VERDICT_JSON_SCHEMA at $ACTION_PATH"
          exit 1
        }
        if [ -z "$JSON_SCHEMA" ]; then
          echo "::error::review-pantheon: derived JSON schema is empty — pantheon.providers.VERDICT_JSON_SCHEMA at $ACTION_PATH resolved to nothing"
          exit 1
        fi

        # JSON_SCHEMA above contains only double quotes, never a single quote, so wrapping it
        # in single quotes here (for the CLI arg) needs no further escaping. ALLOWED_TOOLS
        # (computed above from the execution tier) never contains a double quote either.
        #
        # --permission-mode dontAsk (not left unset, which is what this action did before this
        # fix): Claude Code's own docs are explicit that without it, a tool call matching
        # --allowedTools still goes through a permission decision that nothing can answer outside
        # an interactive terminal — `dontAsk` is documented as the mode for "locked-down CI and
        # scripts": it auto-denies anything not pre-approved and never waits for input.
        # Empirically confirmed the gap this closes: a live run of this action (no explicit
        # --permission-mode, matching the pre-fix state) reported the wrapper's own invocation as
        # unreachable while Claude Code's separate, unconditional built-in "read-only forms of
        # git" allowance kept bare `git log`/`git diff` working regardless — see
        # pantheon/execution.py's own module docstring for the fuller writeup (a real Apollo
        # finding, from this PR's own self-review, on this exact composite action).
        #
        # NO --bare here, deliberately (adversarial review, round 8 — see the CRITICAL
        # finding/resolution history comment at the top of this file's `steps:` for the full
        # writeup, including WHY this lane's CRITICAL-1 config/MCP/hooks vector needs no CLI flag
        # or workspace mutation of its own — claude-code-action's own pinned source already
        # restores the sensitive paths from the PR's base branch, unconditionally, before this
        # step's own invocation ever runs). A first version of THIS fix DID pass --bare
        # unconditionally here; a live self-hosted-gate run then failed both agents to UNVERIFIED
        # with `--json-schema was provided but Claude did not return structured_output` — --bare
        # is empirically incompatible with --json-schema-driven structured output on THIS Action
        # lane. DO NOT add --bare back here without first proving structured_output survives it
        # in a live run — no assumption, the same bar this repo's own docs-verification claims
        # everywhere else already hold to.
        CLAUDE_ARGS="--allowedTools \"$ALLOWED_TOOLS\"
        --permission-mode dontAsk
        --json-schema '$JSON_SCHEMA'"
        if [ -n "$MODEL" ]; then
          CLAUDE_ARGS="$CLAUDE_ARGS
        --model $MODEL"
        fi

        delim="pantheon_$(openssl rand -hex 16)"
        {
          echo "claude_args<<$delim"
          echo "$CLAUDE_ARGS"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

    - name: Detect docs-only diff
      id: docs-check
      if: ${{ steps.auth.outputs.gated != 'false' }}
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        docs_only=true
        changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
        if [ -z "$changed" ]; then
          docs_only=false
        else
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*) ;;
              *) docs_only=false ;;
            esac
          done <<< "$changed"
        fi
        echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

