        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ inputs.github_token }}
        prompt: ${{ steps.build-prompt-plato.outputs.prompt }}
        claude_args: ${{ steps.resolve.outputs.claude_args }}

    - name: Save raw output (plato)
      id: save-raw-plato
      if: ${{ (contains(inputs.agents, 'plato')) && steps.auth.outputs.gated != 'false' }}
      continue-on-error: true
      shell: bash
      env:
        RAW_OUTPUT: ${{ steps.run-agent-plato.outputs.structured_output }}
      run: printf '%s\n' "$RAW_OUTPUT" > "$RUNNER_TEMP/plato-raw.txt"

    - name: Decide verdict (plato)
      id: decide-plato
      if: ${{ (contains(inputs.agents, 'plato')) && steps.auth.outputs.gated != 'false' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: PYTHONPATH="$ACTION_PATH" python3 "$ACTION_PATH/pantheon/verdict.py" plato "$RUNNER_TEMP/plato-raw.txt"

    # -------------------------------------------------------------------------------------
    # Combine + enforce — runs regardless of which/whether prior steps failed, because every
    # step above that CAN fail by design (a red/unverified verdict, a provider error) carries
    # `continue-on-error: true`, so none of them ever mark this composite action itself
    # failed. Nothing here needs `if: always()` as a result — see this file's header comment
    # on why that's a deliberate choice, not an oversight.
    # -------------------------------------------------------------------------------------
    - name: Build and post combined comment
      id: combine
      if: ${{ steps.auth.outputs.gated != 'false' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        POST_COMMENT: ${{ inputs.post_comment }}
        APOLLO_DOCS_SKIPPED: ${{ steps.docs-check.outputs.docs_only }}
        ARTEMIS_COLOR: ${{ steps.decide-artemis.outputs.color }}
        ARTEMIS_VERDICT: ${{ steps.decide-artemis.outputs.verdict }}
        ARTEMIS_TOP: ${{ steps.decide-artemis.outputs.top_finding }}
        ARTEMIS_FINDINGS: ${{ steps.decide-artemis.outputs.findings_json }}
        ARTEMIS_INVARIANT: ${{ steps.decide-artemis.outputs.invariant_fired }}
        ARTEMIS_REASON: ${{ steps.decide-artemis.outputs.reason }}
        APOLLO_COLOR: ${{ steps.decide-apollo.outputs.color }}
        APOLLO_VERDICT: ${{ steps.decide-apollo.outputs.verdict }}
        APOLLO_TOP: ${{ steps.decide-apollo.outputs.top_finding }}
        APOLLO_FINDINGS: ${{ steps.decide-apollo.outputs.findings_json }}
        APOLLO_INVARIANT: ${{ steps.decide-apollo.outputs.invariant_fired }}
        APOLLO_REASON: ${{ steps.decide-apollo.outputs.reason }}
        SOCRATES_COLOR: ${{ steps.decide-socrates.outputs.color }}
        SOCRATES_VERDICT: ${{ steps.decide-socrates.outputs.verdict }}
        SOCRATES_TOP: ${{ steps.decide-socrates.outputs.top_finding }}
        SOCRATES_FINDINGS: ${{ steps.decide-socrates.outputs.findings_json }}
        SOCRATES_INVARIANT: ${{ steps.decide-socrates.outputs.invariant_fired }}
        SOCRATES_REASON: ${{ steps.decide-socrates.outputs.reason }}
        DIOGENES_COLOR: ${{ steps.decide-diogenes.outputs.color }}
        DIOGENES_VERDICT: ${{ steps.decide-diogenes.outputs.verdict }}
        DIOGENES_TOP: ${{ steps.decide-diogenes.outputs.top_finding }}
        DIOGENES_FINDINGS: ${{ steps.decide-diogenes.outputs.findings_json }}
        DIOGENES_INVARIANT: ${{ steps.decide-diogenes.outputs.invariant_fired }}
        DIOGENES_REASON: ${{ steps.decide-diogenes.outputs.reason }}
        PLATO_COLOR: ${{ steps.decide-plato.outputs.color }}
        PLATO_VERDICT: ${{ steps.decide-plato.outputs.verdict }}
        PLATO_TOP: ${{ steps.decide-plato.outputs.top_finding }}
        PLATO_FINDINGS: ${{ steps.decide-plato.outputs.findings_json }}
        PLATO_INVARIANT: ${{ steps.decide-plato.outputs.invariant_fired }}
        PLATO_REASON: ${{ steps.decide-plato.outputs.reason }}
        AGENTS: ${{ inputs.agents }}
      run: bash "$ACTION_PATH/action/lib/combine_verdicts.sh" "$AGENTS"

    - name: Enforce gate result
      if: ${{ steps.auth.outputs.gated != 'false' }}
      shell: bash
      env:
        OVERALL_COLOR: ${{ steps.combine.outputs.overall_color }}
      run: |
        set -euo pipefail
        case "$OVERALL_COLOR" in
          green|yellow) exit 0 ;;
          red) echo "::error::review-pantheon: blocked (a gate agent returned a red verdict, or the blocker invariant fired)"; exit 1 ;;
          *) echo "::error::review-pantheon: NOT GATED (unverified result) — fail-closed, not a pass"; exit 1 ;;
        esac
