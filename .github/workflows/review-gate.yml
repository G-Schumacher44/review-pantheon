# The repo's own README Quick start, installed on itself — every PR here is reviewed by
# the RELEASED action (@v1), not by the PR's own code (the upstream reviewer refuses a
# workflow that differs from the default branch, so this cannot gate the PR that adds it;
# it activates on the first PR event after this merges to dev).
name: review-pantheon
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: ${{ vars.REVIEW_GATE_ENABLED == 'true' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: G-Schumacher44/review-pantheon@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
