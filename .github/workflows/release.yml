# .github/workflows/release.yml — builds and publishes a tagged GitHub Release.
#
# Fires on push of a `vX.Y.Z` tag (the operator's ceremony — see RELEASING.md at repo root for
# the actual promotion-then-tag flow; this workflow never creates tags itself, only reacts to
# one that already landed). Two jobs:
#
#   1. test    — the SAME suite ci.yml's `lint-and-test` job runs (bash -n, shellcheck,
#                py_compile, YAML-parse, every fixture suite including the Python-port ones, the
#                pantheon package's own pip install + ruff/mypy/pytest quality gates), re-run at
#                the tagged commit as the release gate. A release built from a commit that fails
#                this suite is worse than no release, so this job blocking `build-and-publish`
#                (via `needs:`) is the whole point — deliberately NOT the full ci.yml (no Docker
#                setup-smoke, no composite-action-self-check) since those need a Docker daemon /
#                PR context this tag-push trigger doesn't have; the fixture+lint+quality-gate
#                suite below is the part of ci.yml that's meaningful to re-run against an
#                arbitrary tagged commit. Its first three steps gate everything else: the tag
#                must be a strict semver, its commit must be reachable from origin/main (i.e.
#                RELEASING.md's dev->main promotion ceremony was actually followed, not a stray
#                tag cut from dev or elsewhere), AND the tag must match pyproject.toml's own
#                `version` field (RELEASING.md's "bump version to match the tag before tagging"
#                ceremony step — fail loud on mismatch rather than publish a tarball/wheel whose
#                own `pantheon --version`-adjacent metadata disagrees with the tag it shipped
#                under).
#   2. build-and-publish — stages the CLI surface (explicit file list, no globs — see the step
#                below for why), tars it as review-pantheon-<tag>.tar.gz, generates SHA256SUMS,
#                and creates the GitHub Release with `gh release create`, notes auto-generated.
#   3. publish-pypi — needs build-and-publish (so a GitHub Release only gets a PyPI counterpart
#                once the tarball/SHA256SUMS release step above has actually succeeded), builds
#                the sdist+wheel via `python -m build`, and publishes them with PyPA's official
#                trusted-publisher action — OIDC only (id-token: write), no API token, no secret.
#                The trusted publisher on PyPI is configured for owner G-Schumacher44, repo
#                review-pantheon, workflow release.yml, environment pypi; `environment: pypi`
#                below must match that configuration exactly or PyPI refuses the OIDC exchange.
#
# Permissions are set at the job level, not workflow level, so the `test` job (which needs
# nothing beyond reading the checkout) doesn't inherit the write scope `build-and-publish` needs,
# and `build-and-publish`'s `contents: write` doesn't leak into `publish-pypi`'s `id-token: write`.
name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    # Re-run of ci.yml's lint-and-test job shape, pinned at the tag instead of a branch head —
    # see this file's header comment for why this is a SUBSET of ci.yml (not the whole thing).
    runs-on: ubuntu-latest
    permissions:
      contents: read # only needs to read the tagged checkout
    steps:
      # GitHub's `v*.*.*` tag-filter trigger above is a GLOB, not a semver validator — `*`
      # matches any non-`/` characters, so e.g. `v1.2.3-rc1` or `vfoo.bar.baz` also fire this
      # workflow (Codex finding on this PR). bootstrap.sh's `--version` flag only ever accepts
      # the strict `^v[0-9]+\.[0-9]+\.[0-9]+$` shape (see its header comment), so without this
      # check the workflow could publish a Release that lane can never fetch. Fail fast, before
      # spending any CI time on a tag that will never be consumable.
      - name: Validate tag is a strict vX.Y.Z semantic version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' matched this workflow's 'v*.*.*' glob trigger but is NOT a strict vX.Y.Z semantic version (no pre-release/build suffix, digits only). bootstrap.sh's --version flag requires exactly this shape and would refuse to fetch a release built from this tag — see RELEASING.md. Delete this tag and re-tag with a strict vX.Y.Z."
            exit 1
          fi
          echo "tag '$TAG' is a valid vX.Y.Z release tag"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — resolved via gh api repos/actions/checkout/git/ref/tags/v4
        with:
          fetch-depth: 0 # full history — the ancestry check below needs origin/main's real
          # history, not the shallow single-commit checkout actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — resolved via gh api repos/actions/checkout/git/ref/tags/v4 does by default

      - name: Verify tag is reachable from main (the promotion ceremony was actually followed)
        run: |
          set -euo pipefail
          # RELEASING.md's ceremony is dev -> (promotion PR) -> protected main -> tag main's
          # commit. Nothing before this enforced that ORDER — a well-formed vX.Y.Z tag cut
          # straight from dev (or any commit never promoted to main) passed the semver check
          # above and would otherwise build and publish a release anyway (Codex finding on this
          # PR). Refuse unless the tagged commit is an ancestor of origin/main.
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag '${GITHUB_REF_NAME}' (commit ${GITHUB_SHA}) is NOT reachable from origin/main. RELEASING.md requires promoting dev to main via PR BEFORE tagging — this commit was never promoted (or main has since moved past a point that would make it so). Refusing to build a release from it; see RELEASING.md's checklist."
            exit 1
          fi
          echo "tag '${GITHUB_REF_NAME}' (commit ${GITHUB_SHA}) is reachable from origin/main — promotion ceremony was followed"

      - name: Verify tag matches pyproject.toml's version (RELEASING.md's ceremony step)
        run: |
          set -euo pipefail
          # RELEASING.md's checklist requires bumping pyproject.toml's `version` (PEP 440,
          # no "v" prefix) to match the tag BEFORE tagging. Without this gate, a
          # forgotten bump would publish a tarball/wheel whose own package metadata (and, once a
          # `pantheon --version`-style surface reads it, the CLI's own self-report) disagrees
          # with the tag it shipped under, silently.
          TAG="${GITHUB_REF_NAME}"
          PYPROJECT_VERSION="$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/^version = "([^"]*)"/\1/')"
          if [[ -z "$PYPROJECT_VERSION" ]]; then
            echo "::error::could not find a 'version = \"...\"' line in pyproject.toml"
            exit 1
          fi
          EXPECTED_TAG="v${PYPROJECT_VERSION}"
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::tag '$TAG' does not match pyproject.toml's version '$PYPROJECT_VERSION' (expected tag '$EXPECTED_TAG'). RELEASING.md's ceremony requires bumping pyproject.toml's version to match the tag BEFORE tagging (part of the dev->main promotion PR, or a follow-up commit on main before the tag is cut) — see RELEASING.md's checklist. Delete this tag, bump the version, re-promote/re-tag."
            exit 1
          fi
          echo "tag '$TAG' matches pyproject.toml's version '$PYPROJECT_VERSION'"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 — resolved via gh api repos/actions/setup-python/git/ref/tags/v5
        with:
          python-version: "3.x"

      - name: Install shellcheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: bash -n on every shell script
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          exit "$status"

      - name: shellcheck on every shell script
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "shellcheck $f"
            shellcheck "$f" || status=1
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          exit "$status"

      - name: py_compile every Python file
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "py_compile $f"
            python3 -m py_compile "$f" || status=1
          done < <(find . -type f -name '*.py' -not -path './.git/*' -print0)
          exit "$status"

      - name: YAML-parse the workflows
        run: |
          pip install --quiet pyyaml
          python3 -c "
          import yaml
          for f in ('action.yml', '.github/workflows/ci.yml', '.github/workflows/release.yml'):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f + ': OK')
          "

      - name: Run verdict-decision fixture tests
        run: bash tests/test-verdict-decision-python.sh

      - name: Run base-pinned-read fixture tests (pantheon.basepin)
        run: bash tests/test-base-pinned-read-python.sh

      - name: Run combined-comment renderer fixture tests
        run: bash tests/test-render-comment-python.sh

      - name: Run JSON-boundary fixture tests (pantheon.jqjson)
        run: bash tests/test-json-boundary.sh

      - name: Run install.sh fixture tests
        run: bash tests/test-install.sh

      - name: Run prompt-assembly fixture tests (pantheon.cli)
        run: bash tests/test-prompt-assembly-python.sh

      - name: Run state-persistence fixture tests (pantheon.state)
        run: bash tests/test-state-persistence-python.sh

      - name: Run git-readonly-wrapper fixture tests (pantheon.execution)
        run: bash tests/test-git-readonly-wrapper.sh

      - name: Run execution-tier fixture tests (pantheon.execution)
        run: bash tests/test-execution-tier-python.sh

      - name: Run action/lib execution-context-note fixture tests (cwd-shadow-import resistance)
        run: bash tests/test-action-lib-execution-note.sh

      - name: Run bootstrap release/checksum fixture tests
        run: bash tests/test-bootstrap-release.sh

      - name: Run bootstrap release fetch/install end-to-end fixture tests
        run: bash tests/test-bootstrap-release-e2e.sh

      - name: Run release.yml tag-validation gate fixture tests
        run: bash tests/test-release-tag-gates.sh

      - name: Install the pantheon package + ruff/mypy/pytest (build-time-only tooling)
        run: pip install --quiet -e . ruff mypy pytest

      - name: pantheon console script smoke check (--help exits 0)
        run: pantheon --help

      - name: ruff check pantheon/ (lint)
        run: ruff check pantheon/ tests/test_*.py

      - name: ruff format --check pantheon/ (format)
        run: ruff format --check pantheon/ tests/test_*.py

      - name: mypy pantheon/ (pyproject.toml's [tool.mypy] config)
        run: mypy

      - name: pytest (jqjson matrix + pure-function seams)
        run: pytest -q

      - name: Assert CONTRIBUTING.md's canonical test table matches tests/*.sh exactly
        # Mirrors ci.yml's lint-and-test job's identically-named step — this workflow claims to
        # re-run "the same suite ci.yml's lint-and-test job runs" (RELEASING.md), so a tagged
        # commit that omits a test from the canonical table must fail here too, not just on dev.
        run: |
          set -euo pipefail
          status=0
          table="$(grep -oE '^\| `tests/test-[a-z0-9-]+\.sh`' CONTRIBUTING.md | sed -E 's/^\| `(tests\/[a-z0-9-]+\.sh)`/\1/')"
          for f in tests/*.sh; do
            grep -qxF "$f" <<<"$table" || { echo "::error::$f is missing from CONTRIBUTING.md's test table (a prose mention elsewhere doesn't count)"; status=1; }
          done
          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            [[ -f "$entry" ]] || { echo "::error::CONTRIBUTING.md's table lists $entry, which no longer exists"; status=1; }
          done <<<"$table"
          exit "$status"

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # contents: write is the ONLY elevated scope this workflow needs — `gh release create`
      # both creates the Release object and uploads assets under the contents API. Everything
      # else (pull-requests, issues, packages, actions, ...) stays at its implicit "none" here
      # since this job never touches them; scoping tight rather than relying on the repo's
      # default token permissions is the point of declaring this block at all.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — resolved via gh api repos/actions/checkout/git/ref/tags/v4
        # need test tooling (shellcheck/python), just the tree contents to package.

      - name: Build versioned tarball
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NAME="review-pantheon-${TAG}"
          STAGE_ROOT="$(mktemp -d)"
          STAGE="${STAGE_ROOT}/${NAME}"
          mkdir -p "$STAGE"

          # Explicit, enumerated CLI-surface manifest — deliberately NOT a glob (`cp -R ./*` or
          # similar) so an untracked or build-only file sitting in the checkout can never leak
          # into a release tarball. This list is the "pantheon CLI surface" contract: the
          # package, the personas, the canonical skills, both installers, and the example
          # config/rules/license/readme a fresh install needs. Keep it in sync by hand if that
          # surface changes.
          #
          # No action/ entry: install.sh's Way A GENERATES its thin-caller workflow at install
          # time (a `uses: G-Schumacher44/review-pantheon@<pinned-SHA>` reference) instead of
          # vendoring a copy of it, so there is no action/review.yml file for install.sh to read
          # from this tarball any more (issue #36 — that reimplementation was deleted, not
          # relocated). action/lib/*.sh stays OUT of this manifest for the reason it always was:
          # it's action.yml's own composite-action runtime, read from that action's own checkout
          # at github.action_path, never something install.sh reads from an extracted tarball.
          #
          # skills/ is included for the identical reason: install.sh unconditionally requires
          # $SCRIPT_DIR/skills to exist (the four canonical Claude Code skills — gate, counsel,
          # spec-driven, design-contract — install.sh --claude installs verbatim), so a release
          # tarball missing it breaks install.sh from an extracted release the same way a missing
          # action/ did before that Codex finding.
          #
          # pantheon/ and pyproject.toml are included because bootstrap.sh's remote-fetch path
          # `pip install`s the package FROM the fetched/extracted tarball (see bootstrap.sh's own
          # header comment) — a release tarball missing either one would make
          # `bootstrap.sh --version vX.Y.Z` (the curl-pipe, no-local-checkout install path) fail
          # with "no pyproject.toml found" the same class of failure the action/ and skills/
          # additions above were fixing for install.sh.
          cp -R agents "$STAGE/agents"
          cp -R skills "$STAGE/skills"
          cp -R pantheon "$STAGE/pantheon"
          cp pyproject.toml "$STAGE/pyproject.toml"
          cp bootstrap.sh "$STAGE/bootstrap.sh"
          cp install.sh "$STAGE/install.sh"
          cp REVIEW_RULES.example.md "$STAGE/REVIEW_RULES.example.md"
          cp gate.conf.example "$STAGE/gate.conf.example"
          cp LICENSE "$STAGE/LICENSE"
          cp README.md "$STAGE/README.md"

          TARBALL="${NAME}.tar.gz"
          tar -czf "$TARBALL" -C "$STAGE_ROOT" "$NAME"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "built $TARBALL:"
          tar -tzf "$TARBALL"

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          # sha256sum (GNU coreutils, this runner) — bootstrap.sh's own checksum verification
          # handles the shasum-only (stock macOS) case on the consuming side; this side only
          # ever runs on ubuntu-latest, so sha256sum alone is sufficient here.
          sha256sum "$TARBALL" > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "$TARBALL" \
            SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  publish-pypi:
    # Only runs once the GitHub Release above has actually been created — see this file's header
    # comment for why this job needs build-and-publish rather than test directly.
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted-publisher OIDC exchange — the only credential this job uses
      contents: read # just needs to read the tagged checkout to build the sdist/wheel
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — resolved via gh api repos/actions/checkout/git/ref/tags/v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 — resolved via gh api repos/actions/setup-python/git/ref/tags/v5
        with:
          python-version: "3.x"

      - name: Install build
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI (trusted publisher — OIDC, no token/secret input)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 — https://github.com/pypa/gh-action-pypi-publish/releases/tag/v1.14.2
        with:
          # PyPI filenames are immutable: if a transient failure lands the sdist but not the
          # wheel (or vice versa), a naive re-run rebuilds both and dies on the already-published
          # file BEFORE uploading the missing one — leaving the release permanently incomplete.
          # skip-existing makes the re-run tolerate the already-published half and upload the rest.
          skip-existing: true
