# .github/workflows/review-counsel.yml — this repo's OWN counsel install (dogfood), split into
# two jobs on the self-test artemis's blocker (PR #99):
#
#   - `counsel-label` (pull_request: labeled `design`) runs the PINNED `@v1` — never `./`. On a
#     labeled PR, `uses: ./` would execute the PR's OWN copy of the action code (action.yml,
#     pantheon/verdict.py) with this repo's secret and write permission — a same-repo PR could
#     tamper with the verdict path and be run at the exact moment it is least vetted. The pin
#     keeps executed code independent of the reviewed diff, same trust boundary as SECURITY.md's
#     fork-PR posture and action.yml's base-pinned `personas_path`.
#   - `counsel-dispatch` (workflow_dispatch) runs `uses: ./` — the action at the CHOSEN ref. A
#     dispatch is a maintainer-initiated act on a ref they deliberately picked, so head-dogfood
#     belongs here and only here.
#
# Consumers: copy examples/review-counsel.yml (all-@v1), not this file. Contract: DESIGN.md's
# "Counsel mode (the Action)".
name: review-pantheon-counsel

on:
  workflow_dispatch: {}
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  counsel-label:
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'design' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: G-Schumacher44/review-pantheon@v1
        with:
          mode: counsel
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  counsel-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: dispatch needs it to resolve a merge-base
      - uses: ./
        with:
          mode: counsel
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
