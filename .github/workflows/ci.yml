# CI for review-pantheon itself — "the review tool must survive its own review". Syntax-checks
# and lints every shell script, byte-compiles every Python module, and runs the verdict-decision
# and combined-comment-renderer fixture tests.
#
# The review.yml gate (lint-and-test/setup-smoke) does NOT run against itself — that requires
# CLAUDE_CODE_OAUTH_TOKEN and REVIEW_GATE_ENABLED, which this repo doesn't set for its own CI.
# The published composite action (action.yml) is similarly untestable end-to-end until this
# repo is public (see DESIGN.md's "Published action" section) — the
# composite-action-self-check job below covers what CAN be verified without that: YAML
# validity, that every file it references actually exists, and (only when a token happens to
# be present) an optional live run against this repo's own PRs.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install shellcheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: bash -n on every shell script
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "bash -n $f"
            bash -n "$f" || status=1
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          exit "$status"

      - name: shellcheck on every shell script
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "shellcheck $f"
            shellcheck "$f" || status=1
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          exit "$status"

      - name: py_compile every Python file
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "py_compile $f"
            python3 -m py_compile "$f" || status=1
          done < <(find . -type f -name '*.py' -not -path './.git/*' -print0)
          exit "$status"

      - name: YAML-parse the workflows
        run: |
          pip install --quiet pyyaml
          python3 -c "
          import yaml
          for f in ('action.yml', '.github/workflows/ci.yml', '.github/workflows/release.yml'):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f + ': OK')
          "

      # actionlint, NOT just the YAML parse above. A pre-flip security review found the
      # since-deleted vendored action/review.yml (issue #36 collapsed it into a thin caller of
      # action.yml — see DESIGN.md's "Published action" section) carrying `|| "literal"` inside a
      # `${{ }}` expression — the expression grammar accepts SINGLE-quoted literals only, so
      # GitHub rejected the file at queue time and the vendored workflow every Way-A adopter
      # installed reviewed exactly zero PRs. The YAML parse above could never catch it: the file
      # WAS valid YAML, and nothing in this repo's own CI executed it either. A check that cannot
      # fail for the actual failure mode is green by construction; this is the check that can.
      #
      # SCOPE, precisely — actionlint does NOT catch the shell-injection shape. An earlier version
      # of this comment claimed it did; that was verified FALSE (re-inserting
      # `top='${{ steps.decide.outputs.top_finding }}'` inside a `run:` block lints clean, exit 0).
      # actionlint's untrusted-input rule fires only for an allowlist of `github.*` contexts and
      # never for `steps.*.outputs.*` — which is exactly the model-derived vector this repo cares
      # about. Claiming coverage you do not have is worse than having none: the next maintainer
      # trusts the check and ships the injection. The separate grep guard below is what actually
      # backs that promise.
      - name: Lint the workflows with actionlint
        env:
          # Pinned to a COMMIT SHA, not `main` and not a tag. This runs on every push/PR, and an
          # unpinned installer from a third-party repo is arbitrary code execution in this job on
          # someone else's commit. A tag is not a pin — its owner can move it. This repo already
          # fails its own build if `claude-code-action` is not pinned to a full 40-char SHA
          # (tests/test-action-refs.sh), so applying a weaker standard to its own tooling was the
          # inconsistency a pre-flip review flagged. 03d0035246f3e81f36aed592ffb4bebf33a03106 is v1.7.7,
          # resolved via `gh api repos/rhysd/actionlint/git/ref/tags/v1.7.7`.
          ACTIONLINT_SHA: "03d0035246f3e81f36aed592ffb4bebf33a03106"
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_SHA}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          # actionlint's own auto-discovery covers .github/workflows/*.yml (ci.yml, release.yml).
          # action.yml is NOT lintable here and cannot be: it is composite-action metadata, so
          # actionlint rejects it ("\"jobs\" section is missing in workflow"). That leaves the
          # published surface — the sole Action surface since issue #36 collapsed the vendored
          # action/review.yml into a thin caller of it — without expression-grammar coverage,
          # which is why the next step exists.
          #
          # -ignore SC2016 ("expressions don't expand in single quotes"): informational only. All
          # occurrences are deliberate single-quoted `grep`/`sed` regex patterns in this file and
          # release.yml (verified: removing the flag surfaces exactly those, nothing else).
          ./actionlint -color -ignore 'SC2016' .github/workflows/*.yml

      # The guard actionlint cannot provide, for the Action surface (action.yml — composite
      # metadata actionlint refuses to parse, see the actionlint step's own comment above).
      # Two classes, both found live on this repo by a pre-flip security review:
      #   1. double-quoted string literals inside `${{ }}` — invalid grammar, rejected at queue
      #      time, workflow silently never runs.
      #   2. `${{ }}` interpolated into a `run:` block — the expression engine substitutes BEFORE
      #      bash parses, so model-authored prose becomes script text (RCE in a job holding
      #      CLAUDE_CODE_OAUTH_TOKEN). Values must travel via `env:` and be read as "$VAR".
      - name: Guard both Action surfaces against expression-injection shapes
        run: python3 tests/check_action_expressions.py

      - name: Run verdict-decision fixture tests
        run: bash tests/test-verdict-decision-python.sh

      - name: Run base-pinned-read fixture tests (pantheon.basepin)
        run: bash tests/test-base-pinned-read-python.sh

      - name: Run combined-comment renderer fixture tests
        run: bash tests/test-render-comment-python.sh

      - name: Run JSON-boundary fixture tests (pantheon.jqjson)
        run: bash tests/test-json-boundary.sh

      - name: Run install.sh fixture tests
        run: bash tests/test-install.sh

      - name: Run prompt-assembly fixture tests (pantheon.cli)
        run: bash tests/test-prompt-assembly-python.sh

      - name: Run state-persistence fixture tests (pantheon.state)
        run: bash tests/test-state-persistence-python.sh

      - name: Run git-readonly-wrapper fixture tests (pantheon.execution)
        run: bash tests/test-git-readonly-wrapper.sh

      - name: Run execution-tier fixture tests (pantheon.execution)
        run: bash tests/test-execution-tier-python.sh

      - name: Run action/lib execution-context-note fixture tests (cwd-shadow-import resistance)
        run: bash tests/test-action-lib-execution-note.sh

      - name: Run bootstrap release/checksum fixture tests
        run: bash tests/test-bootstrap-release.sh

      - name: Run bootstrap release fetch/install end-to-end fixture tests
        run: bash tests/test-bootstrap-release-e2e.sh

      - name: Run release.yml tag-validation gate fixture tests
        run: bash tests/test-release-tag-gates.sh

      - name: Install the pantheon package + ruff/mypy/pytest (build-time-only tooling)
        run: pip install --quiet -e . ruff mypy pytest

      - name: pantheon console script smoke check (--help exits 0)
        run: pantheon --help

      - name: ruff check pantheon/ (lint)
        run: ruff check pantheon/ tests/test_*.py

      - name: ruff format --check pantheon/ (format)
        run: ruff format --check pantheon/ tests/test_*.py

      - name: mypy pantheon/ (pyproject.toml's [tool.mypy] config)
        run: mypy

      - name: pytest (jqjson matrix + pure-function seams)
        run: pytest -q

      - name: Assert CONTRIBUTING.md's canonical test tables + prose counts match tests/* exactly
        run: |
          set -euo pipefail
          status=0

          # -- bash fixture-suite table vs tests/*.sh --
          sh_table="$(grep -oE '^\| `tests/test-[a-z0-9-]+\.sh`' CONTRIBUTING.md | sed -E 's/^\| `(tests\/[a-z0-9-]+\.sh)`/\1/')"
          for f in tests/*.sh; do
            grep -qxF "$f" <<<"$sh_table" || { echo "::error::$f is missing from CONTRIBUTING.md's bash test table (a prose mention elsewhere doesn't count)"; status=1; }
          done
          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            [[ -f "$entry" ]] || { echo "::error::CONTRIBUTING.md's bash test table lists $entry, which no longer exists"; status=1; }
          done <<<"$sh_table"

          # -- pytest unit-layer table vs tests/*.py (same shape, so it can't drift silently the
          # same way the bash table's row-vs-tree check used to be the only thing enforced) --
          py_table="$(grep -oE '^\| `tests/test_[a-z0-9_]+\.py`' CONTRIBUTING.md | sed -E 's/^\| `(tests\/test_[a-z0-9_]+\.py)`/\1/')"
          for f in tests/test_*.py; do
            grep -qxF "$f" <<<"$py_table" || { echo "::error::$f is missing from CONTRIBUTING.md's pytest test table (a prose mention elsewhere doesn't count)"; status=1; }
          done
          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            [[ -f "$entry" ]] || { echo "::error::CONTRIBUTING.md's pytest test table lists $entry, which no longer exists"; status=1; }
          done <<<"$py_table"

          # -- prose counts vs the real tree — a table can be complete while the SENTENCE next to
          # it still cites a stale number (exactly how the bash count drifted to 18 silently
          # across three slices before this check existed); assert the digit, not just the rows.
          sh_count_tree=$(git ls-tree -r --name-only HEAD tests/ | grep -c '\.sh$')
          # test_*.py, not *.py: the sentence this is checked against says "tests/test_*.py", and
          # tests/ also holds CI guard scripts that pytest never collects (check_action_expressions.py).
          # Those coincided until the first non-test .py landed here, at which point counting all
          # .py made the check demand a number the sentence does not describe.
          py_count_tree=$(git ls-tree -r --name-only HEAD tests/ | grep -c '/test_.*\.py$')
          # sort -u: the count sentence is deliberately allowed to appear more than once (the
          # table intro and its own subsection heading both cite it) — dedupe identical repeats,
          # but a genuine mismatch between two citations still surfaces as more than one line,
          # which the single-value check below correctly rejects.
          sh_count_prose="$(grep -oE '\([0-9]+ files; verified against `git ls-tree -r tests/\*\.sh`\)' CONTRIBUTING.md | grep -oE '[0-9]+' | sort -u)"
          py_count_prose="$(grep -oE '\([0-9]+ files, `tests/test_\*\.py`; verified against `git ls-tree -r tests/test_\*\.py`\)' CONTRIBUTING.md | grep -oE '[0-9]+' | sort -u)"
          [[ -n "$sh_count_prose" ]] || { echo "::error::couldn't find CONTRIBUTING.md's bash-suite prose count sentence — did its wording change? update this check's regex to match"; status=1; }
          [[ -n "$py_count_prose" ]] || { echo "::error::couldn't find CONTRIBUTING.md's pytest prose count sentence — did its wording change? update this check's regex to match"; status=1; }
          [[ "$(wc -l <<<"$sh_count_prose")" -eq 1 ]] || { echo "::error::CONTRIBUTING.md cites more than one distinct bash-suite count across its mentions: $sh_count_prose"; status=1; }
          [[ "$(wc -l <<<"$py_count_prose")" -eq 1 ]] || { echo "::error::CONTRIBUTING.md cites more than one distinct pytest count across its mentions: $py_count_prose"; status=1; }
          [[ "$sh_count_prose" == "$sh_count_tree" ]] || { echo "::error::CONTRIBUTING.md's bash-suite prose count ($sh_count_prose) != actual tests/*.sh count ($sh_count_tree)"; status=1; }
          [[ "$py_count_prose" == "$py_count_tree" ]] || { echo "::error::CONTRIBUTING.md's pytest prose count ($py_count_prose) != actual tests/test_*.py count ($py_count_tree)"; status=1; }

          exit "$status"

      # DESIGN.md is a current-state contract, not a changelog (CONTRIBUTING.md's "Fix-round
      # history goes in git" rule, skills/design-contract/SKILL.md's matching exclusion) — fails
      # the build if fix-round narrative creeps back in. Deliberately narrow, case-insensitive
      # markers rather than a broad "history"/"before"/"used to" sweep, which would false-positive
      # on ordinary present-tense prose (e.g. this file's own "before any tool call" phrasing
      # elsewhere in DESIGN.md) — these four are the actual shapes a round-by-round retelling
      # takes, verified against the narrative this check was written to keep out.
      # Issue #31: PR #29 deleted docs/PYTHON-PORT.md, docs/HARDENING-HISTORY.md, and the whole
      # cli/ tree, but left 23 files citing those paths as if they still existed — accuracy debt
      # that misleads a reader into believing dead files are live. This is a FIXED-LIST deny
      # check, not a general "does every path-shaped string in the tree resolve to a real file"
      # scanner: a generic version would have to distinguish a real repo-relative citation like
      # `cli/lib/foo.sh` from an unrelated path-shaped substring that happens to appear in prose
      # or a URL (e.g. install.sh's own `github.com/.../docs/cli/custom-commands.md` link) —
      # false positives a maintainer would have to special-case forever. A short, named list of
      # the specific paths #29 actually deleted has none of that ambiguity: it can never flag
      # something that was never a citation, and it fails loudly the moment one of these EXACT
      # strings reappears — the failure mode this issue exists to prevent. Trade-off: it does not
      # generically catch some future, different deletion; the next one gets its own line here
      # (or a follow-up graduates this to a real existence-check, if the false-positive problem
      # above gets solved). This file is excluded from its own scan (its deny-list literals would
      # otherwise trip themselves).
      - name: No citations of paths deleted in #29 (docs/PYTHON-PORT.md, docs/HARDENING-HISTORY.md, cli/)
        run: |
          set -euo pipefail
          status=0
          deny_patterns=(
            'docs/PYTHON-PORT\.md'
            'docs/HARDENING-HISTORY\.md'
            'cli/lib/'
            'cli/review-gate'
            'cli/providers/'
          )
          for pattern in "${deny_patterns[@]}"; do
            hits="$(git grep -nE "$pattern" -- ':!.github/workflows/ci.yml' || true)"
            if [[ -n "$hits" ]]; then
              echo "::error::found a citation of a path deleted in #29 (pattern: $pattern) — reword it as history instead of a live pointer (see issue #31)"
              echo "$hits"
              status=1
            fi
          done
          exit "$status"

      - name: DESIGN.md contains no fix-round narrative markers
        run: |
          set -uo pipefail
          # `|| true` is load-bearing, not decoration: GitHub Actions runs `run:` blocks under
          # `bash -e` by default (`shell: bash` resolves to `bash --noprofile --norc -eo
          # pipefail {0}`), and grep exits 1 when it finds NO match — the everyday "DESIGN.md is
          # clean" case. Without this, the clean case aborts the step right here, before the
          # `if` below ever runs, so the check could never go green on any input (planted-marker
          # AND clean both "fail," just for different reasons) — caught by the coordinator after
          # a real CI run on this exact step failed with zero markers actually present.
          hits="$(grep -noE 'Round [0-9]+|first attempt|the fix was|previously we' DESIGN.md || true)"
          if [[ -n "$hits" ]]; then
            echo "::error::DESIGN.md contains fix-round narrative marker(s) — a contract describes current-state behavior only; fix-round history belongs in git (commit messages, PR descriptions), never the doc. See CONTRIBUTING.md's design-constraints section."
            echo "$hits"
            exit 1
          fi
          echo "DESIGN.md: no fix-round narrative markers found"

  setup-smoke:
    # Clean-machine, real-Linux run of the setup story (see Dockerfile.smoke's header): required
    # binaries, both fixture suites above, install.sh and bootstrap.sh against fresh scratch
    # targets, and — only with a working token — one tokened `pantheon gate --pr <n> --dry-run`
    # against a real, pinned public PR. Separate job from lint-and-test so a setup-story
    # regression doesn't get muddled with a lint/fixture failure in the CI summary.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Dockerfile.smoke
        run: docker build -f Dockerfile.smoke -t review-pantheon-smoke .

      - name: Run tests/test-setup-smoke.sh in container
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN review-pantheon-smoke

  composite-action-self-check:
    # Verifies the published action (action.yml + examples/) — see this file's header comment
    # and DESIGN.md's "Published action" section for why full integration testing has to wait
    # until this repo is public. Separate job so a regression here doesn't get muddled with
    # lint-and-test's or setup-smoke's summary line.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed by the live self-test below, which posts the combined comment (post_comment: "true") when it runs; only exercised on a pull_request event with the token secret present, harmless otherwise
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # action.yml needs base...head to compute the diff, same as review.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: YAML-parse action.yml and examples/
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 -c "
          import glob, yaml
          files = ['action.yml'] + sorted(glob.glob('examples/*.yml')) + sorted(glob.glob('examples/*.yaml'))
          assert files, 'no examples/*.yml found — did the stub move?'
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f + ': OK')
          "

      - name: Assert every github.action_path reference in action.yml exists (+ SHA-pin checks)
        run: bash tests/test-action-refs.sh

      - name: Live self-test — skip notice
        if: github.event_name != 'pull_request' || env.HAS_CLAUDE_TOKEN != 'true'
        run: |
          echo "::notice::Skipping the live self-test — $( [ "$GITHUB_EVENT_NAME" != 'pull_request' ] && echo 'not a pull_request event' || echo 'CLAUDE_CODE_OAUTH_TOKEN is not set on this repo' ). This is expected today; see this file's header comment and DESIGN.md's 'Published action' section for what CI verifies without it."
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      # Fail-soft by design: this step only runs when both conditions hold (a real PR, a real
      # token). Nothing here should ever cause this job to fail for a fork PR or a repo that
      # hasn't wired the secret — that's the skip step above's job, and it's not a failure.
      - name: Live self-test — run review-pantheon gate against this PR
        if: github.event_name == 'pull_request' && env.HAS_CLAUDE_TOKEN == 'true'
        uses: ./
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          post_comment: "true" # let the twins' verdict comment land on this repo's own PRs — this
          # IS the acceptance proof for the combined-comment renderer (pantheon.render):
          # a real composite-action run, on a real PR, posting the new human-first format. Was
          # "false" (mechanics-only, no comment) before the renderer existed to prove out.
          execution: trusted # this IS the own-repo/trusted-author case execution=readonly's own
          # docs name as the exception (DESIGN.md's "Security posture") — review-pantheon
          # reviewing its own PRs, opened by its own maintainer, from its own checkout. readonly
          # stays the default for every OTHER consumer of this action (reviewing someone else's
          # fork PR), which this input does not change; it only affects this one self-test
          # invocation, against this one repo's own PRs.
