# review-pantheon — GitHub Actions twin gate (Claude lane).
#
# Runs Artemis and Apollo as two legs of one matrix job, then a third job posts one combined
# PR comment. Gated on the `REVIEW_GATE_ENABLED` repo variable so installing this file never
# silently starts gating PRs. Also skips draft PRs outright (GitHub fires `opened` for drafts
# too, so this isn't automatic — see the job `if:` below) to match the CLI lane's draft
# behavior: no review run, nothing posted.
#
# PIN NOTE: `anthropics/claude-code-action` is pinned below to v1.0.183's full commit SHA
# (be7b93b1907a4abad570368f3c74b6fe3807510b — https://github.com/anthropics/claude-code-action/
# releases/tag/v1.0.183), verified by reading that release's actual action.yml, not assumed:
# https://raw.githubusercontent.com/anthropics/claude-code-action/be7b93b1907a4abad570368f3c74b6fe3807510b/action.yml
# If you re-pin to a newer release yourself, confirm the pinned SHA matches a release you
# trust (`gh api repos/anthropics/claude-code-action/git/ref/tags/<tag>`) and re-check the
# `with:` inputs and output below against that release's action.yml — the action's interface
# can change between releases. What's used here, confirmed against v1.0.183's action.yml
# (v1's inputs differ from v0.x — see that repo's docs/migration-guide.md): auth via
# `claude_code_oauth_token`, prompt via `prompt`, tool allowlist via `--allowedTools` inside
# the free-form `claude_args` input (there is no `allowed_tools` input in v1 — that was a v0.x
# input, removed), and the agent's structured result via the `structured_output` output
# (there is no `result` output in v1 at all), populated by passing `--json-schema` in
# `claude_args` — see https://github.com/anthropics/claude-code-action/blob/be7b93b1907a4abad570368f3c74b6fe3807510b/docs/usage.md#structured-outputs.
# See install.sh's post-install checklist.
name: review-pantheon

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  # No id-token: write — not needed because we pass github_token: ${{ github.token }} to
  # claude-code-action explicitly below. anthropics/claude-code-action's token.ts checks the
  # github_token input FIRST and skips its internal OIDC-token-exchange bootstrap entirely when
  # one is supplied; only when github_token is unset does it fall back to exchanging an OIDC
  # token for a GitHub App token, which requires this permission. See run 30663863514 for what
  # it looks like when that bootstrap dies without it: "Could not fetch an OIDC token", every
  # per-agent step's continue-on-error swallows the failure, structured_output comes back
  # empty, and the gate correctly fails closed as NOT GATED.

jobs:
  review:
    if: ${{ vars.REVIEW_GATE_ENABLED == 'true' && github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        agent: [artemis, apollo]
    runs-on: ubuntu-latest
    steps:
      - name: Assert CLAUDE_CODE_OAUTH_TOKEN secret is present
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set — the gate fails loud, it does not skip."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect docs-only diff
        id: docs-check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=true
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if [ -z "$changed" ]; then
            docs_only=false
          else
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                *.md|docs/*) ;;
                *) docs_only=false ;;
              esac
            done <<< "$changed"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      # Apollo's docs-only skip is a per-leg condition, not a separate job: on a docs-only
      # diff, Apollo (matrix.agent == 'apollo') skips every remaining step below and the
      # "Save verdict artifact" step at the bottom synthesizes its SKIPPED result directly.
      # Artemis always runs.
      - name: Log docs-only skip
        if: matrix.agent == 'apollo' && steps.docs-check.outputs.docs_only == 'true'
        run: echo "::notice::docs-only diff — skipping Apollo loudly (nothing but docs changed)."

      - name: Build prompt
        id: build-prompt
        if: matrix.agent != 'apollo' || steps.docs-check.outputs.docs_only != 'true'
        env:
          AGENT_NAME: ${{ matrix.agent }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          PERSONA="$GITHUB_WORKSPACE/.github/review-agents/${AGENT_NAME}.md"
          if [ ! -f "$PERSONA" ]; then
            echo "::error::missing $PERSONA — run install.sh (review-pantheon) in this repo first."
            exit 1
          fi
          PROMPT_FILE="$RUNNER_TEMP/${AGENT_NAME}-prompt.md"
          awk '
            /^---[[:space:]]*$/ { fence++; next }
            fence >= 2 { print }
          ' "$PERSONA" > "$PROMPT_FILE"
          {
            echo
            echo "---"
            echo "## Run context"
            echo "- Repo: $REPO_NAME"
            printf -- "- PR: #%s - %s\n" "$PR_NUMBER" "$PR_TITLE"
            echo "- Diff range: ${BASE_SHA}...${HEAD_SHA}"
            echo "- Base branch: $BASE_REF"
            if [ -f "$GITHUB_WORKSPACE/REVIEW_RULES.md" ]; then
              echo "- House rules file: REVIEW_RULES.md (present - treat each rule as a blocker-class check)"
            else
              echo "- House rules file: REVIEW_RULES.md (not present - skip house-rule checks, note it)"
            fi
            # Spec-file context — apollo only, not artemis (same only-if-exists semantics as
            # the house-rules line above; hardcoded DESIGN.md, same as REVIEW_RULES.md above,
            # since this vendored workflow has no gate.conf/input surface — see DESIGN.md's
            # "Lane differences"). The persona skips this check silently when the line is
            # absent, so a repo with no DESIGN.md gets today's behavior unchanged.
            if [ "$AGENT_NAME" = "apollo" ] && [ -f "$GITHUB_WORKSPACE/DESIGN.md" ]; then
              echo "- Spec file: DESIGN.md (present — check the delivered change against the sections of it relevant to the changed behavior; a contradiction is a finding that states both resolutions: fix the code or amend the spec)"
            fi
            echo
            echo "Use \`git diff ${BASE_SHA}...${HEAD_SHA}\`, \`git show <ref>:path\`, and \`git log\` to inspect the change."
            echo
            echo "## Output contract"
            echo "End your response with exactly one JSON verdict object, per your persona instructions above, and nothing after it. No prose after the JSON."
          } >> "$PROMPT_FILE"
          delim="pantheon_$(openssl rand -hex 16)"
          {
            echo "prompt<<$delim"
            cat "$PROMPT_FILE"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run review agent
        id: run-agent
        if: matrix.agent != 'apollo' || steps.docs-check.outputs.docs_only != 'true'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183 — https://github.com/anthropics/claude-code-action/releases/tag/v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.build-prompt.outputs.prompt }}
          # v1 has no `allowed_tools` input (that was v0.x, removed — see this file's header
          # comment) — the tool allowlist travels inside `claude_args` as `--allowedTools`
          # instead. `--json-schema` is the verdict-contract shape (DESIGN.md), structural
          # only — NOT each agent's own verdict vocabulary, which stays sole-sourced in
          # action/decide_verdict.py (see DESIGN.md's "Two runtimes, one rule").
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash"
            --json-schema '{"type":"object","properties":{"agent":{"type":"string"},"verdict":{"type":"string"},"has_blocker":{"type":"boolean"},"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string"},"file":{"type":"string"},"line":{"type":"integer"},"issue":{"type":"string"},"scenario":{"type":"string"}},"required":["severity","file","line","issue","scenario"]}},"summary":{"type":"string"}},"required":["agent","verdict","has_blocker","findings","summary"]}'

      - name: Save raw agent output
        if: always() && (matrix.agent != 'apollo' || steps.docs-check.outputs.docs_only != 'true')
        env:
          AGENT_NAME: ${{ matrix.agent }}
          # v1 has no `result` output — the agent's structured verdict comes back through
          # `structured_output` (populated by the `--json-schema` flag above). See this file's
          # header comment for the source that was checked to confirm this.
          RAW_OUTPUT: ${{ steps.run-agent.outputs.structured_output }}
        run: printf '%s\n' "$RAW_OUTPUT" > "$RUNNER_TEMP/${AGENT_NAME}-raw.txt"

      # Same decision rule as the CLI lane's cli/lib/verdict.sh (extract trailing JSON,
      # validate the schema, map verdict->color, enforce the blocker invariant) — this runs
      # the installed copy of action/decide_verdict.py so there is exactly one Python
      # implementation of the rule, not a copy embedded in this YAML that can drift from it.
      - name: Decide verdict
        id: decide
        if: always() && (matrix.agent != 'apollo' || steps.docs-check.outputs.docs_only != 'true')
        env:
          AGENT_NAME: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          SCRIPT="$GITHUB_WORKSPACE/.github/review-agents/decide_verdict.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::missing $SCRIPT — run install.sh (review-pantheon) in this repo first."
            exit 1
          fi
          python3 "$SCRIPT" "$AGENT_NAME" "$RUNNER_TEMP/${AGENT_NAME}-raw.txt"

      - name: Save verdict artifact
        if: always()
        env:
          AGENT_NAME: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verdicts"
          if [ "$AGENT_NAME" = "apollo" ] && [ "${{ steps.docs-check.outputs.docs_only }}" = "true" ]; then
            color="yellow"; verdict="SKIPPED"; top="docs-only diff: apollo skipped by design"
            findings='{"agent":"apollo","verdict":"SKIPPED","has_blocker":false,"findings":[],"summary":"docs-only diff: apollo skipped by design"}'
          else
            color="${{ steps.decide.outputs.color || 'unverified' }}"
            verdict="${{ steps.decide.outputs.verdict || 'UNVERIFIED' }}"
            top='${{ steps.decide.outputs.top_finding || "decide step did not run" }}'
            findings='${{ steps.decide.outputs.findings_json || "{}" }}'
          fi
          cat > "$RUNNER_TEMP/verdicts/${AGENT_NAME}.json" <<EOF
          {"agent":"${AGENT_NAME}","color":"$color","verdict":"$verdict"}
          EOF
          printf '%s' "$findings" > "$RUNNER_TEMP/verdicts/${AGENT_NAME}-findings.json"
          printf '%s' "$top" > "$RUNNER_TEMP/verdicts/${AGENT_NAME}-top.txt"

      # Matrix legs each get their own job-output namespace and cannot expose distinct static
      # `jobs.<id>.outputs` back to a downstream job (the last leg to finish would silently
      # clobber the others) — that's why results travel via a per-leg artifact instead. Do
      # not "simplify" this into job outputs; it will collide.
      - name: Upload verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-${{ matrix.agent }}
          path: ${{ runner.temp }}/verdicts/
          retention-days: 14

  post-comment:
    needs: [review]
    if: ${{ always() && vars.REVIEW_GATE_ENABLED == 'true' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download verdict artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/verdicts
          pattern: verdict-*
          merge-multiple: false

      - name: Build and post combined comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          VERDICTS_DIR="$RUNNER_TEMP/verdicts"
          overall="green"
          rows=""
          details=""
          any_findings=false

          # The standard gate is the hardcoded twin panel (artemis, apollo) — see DESIGN.md.
          for agent in artemis apollo; do
            dir="$VERDICTS_DIR/verdict-$agent"
            color="unverified"; verdict="UNVERIFIED"; top="job did not report a result"
            if [ -f "$dir/$agent.json" ]; then
              color="$(python3 -c "import json,sys; print(json.load(open('$dir/$agent.json')).get('color','unverified'))")"
              verdict="$(python3 -c "import json,sys; print(json.load(open('$dir/$agent.json')).get('verdict','UNVERIFIED'))")"
            fi
            if [ -f "$dir/$agent-top.txt" ]; then
              top="$(cat "$dir/$agent-top.txt")"
            fi
            rows="${rows}| ${agent} | ${verdict} | ${top} |
          "
            case "$color" in
              red) overall="red" ;;
              unverified) [ "$overall" = "red" ] || overall="unverified" ;;
              yellow) [ "$overall" = "green" ] && overall="yellow" || true ;;
            esac

            has_findings=false
            if [ -f "$dir/$agent-findings.json" ]; then
              has_findings="$(python3 -c "import json; d=json.load(open('$dir/$agent-findings.json')); print('true' if d.get('findings') else 'false')" 2>/dev/null || echo false)"
            fi
            if [ "$has_findings" = "true" ]; then
              any_findings=true
            fi
            if { [ "$color" != "green" ] || [ "$has_findings" = "true" ]; } && [ -f "$dir/$agent-findings.json" ]; then
              details="${details}
          **${agent}**

          \`\`\`json
          $(cat "$dir/$agent-findings.json")
          \`\`\`
          "
            fi
          done

          case "$overall" in
            green) headline="🟢 review-pantheon: all clear" ;;
            yellow) headline="🟡 review-pantheon: review notes" ;;
            unverified) headline="🟠 review-pantheon: NOT GATED (unverified result)" ;;
            red) headline="🔴 review-pantheon: blocked" ;;
          esac

          comment_file="$RUNNER_TEMP/comment.md"
          {
            echo "### $headline"
            echo
            echo "| Agent | Verdict | Top finding |"
            echo "|---|---|---|"
            printf '%s' "$rows"
            # Fold findings in whenever ANY agent actually reported some — not only when the
            # overall signal isn't green (an agent can find should_fix/note items and still
            # land on a green-mapped verdict).
            if [ "$overall" != "green" ] || [ "$any_findings" = "true" ]; then
              echo
              echo "<details>"
              echo "<summary>Full findings</summary>"
              printf '%s' "$details"
              echo "</details>"
            fi
          } > "$comment_file"

          gh pr comment "$PR_NUMBER" --body-file "$comment_file" \
            || echo "::warning::failed to post the combined review comment (non-fatal)"
