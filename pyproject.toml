# pyproject.toml — the "pantheon" package, review-pantheon's Python CLI. `pantheon.cli` (the
# [project.scripts] entry point below, `pantheon = "pantheon.cli:main"`) is THE CLI — there is no
# other runtime. `pip install -e .` against this tree installs one console script and runs it.
#
# stdlib-only at runtime is a hard constraint — [project.dependencies] must stay empty for the
# life of this package. The build backend below (setuptools) is a build-time-only dependency,
# never installed for an end user of the published package, and does not compromise that
# constraint. Same posture for ruff/mypy/pytest (this file's own
# [tool.ruff]/[tool.mypy]/[tool.pytest.ini_options] sections) — CI/dev-only tooling, never a
# runtime dependency.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-pantheon"  # PyPI dist name ("pantheon" is taken upstream); import package + console command stay `pantheon`
version = "0.2.3"
description = "review-pantheon's Python CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Garrett Schumacher" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/G-Schumacher44/review-pantheon"
Documentation = "https://github.com/G-Schumacher44/review-pantheon/blob/dev/docs/CLI.md"
Issues = "https://github.com/G-Schumacher44/review-pantheon/issues"

[project.scripts]
pantheon = "pantheon.cli:main"
# The readonly execution tier's own Bash-tool entry point (`pantheon.cli`'s `_WRAPPER_INVOCATION`/
# `pantheon.providers`' `_FALLBACK_WRAPPER_CMD` resolve THIS installed script's own absolute path,
# not a bare `python -m pantheon.execution wrapper` invocation — a Codex review finding on this
# port's own PR: `python -m <module>` prepends the CURRENT WORKING DIRECTORY to sys.path, and a
# provider now runs with the target repo's own (potentially hostile) checkout as its cwd, so a
# PR-committed `pantheon/execution.py` would get imported instead of the real one. A console-
# script entry point doesn't have this problem — its own generated launcher's `sys.path[0]` is
# the SCRIPT'S OWN directory (this package's install location), never the caller's cwd, verified
# live against a hostile-checkout repro — so this closes the shadow vector without the collateral
# damage an earlier `-I` (isolated mode) fix caused (a follow-up finding: `-I` also disables
# user-site-packages, breaking a `pip install --user` deployment).
pantheon-git-readonly = "pantheon.execution:main"

# Explicit (not `packages.find`) — this package needs a second, non-`pantheon*`-named package
# folded in (see the package-dir remap below), and a hand-listed two-entry list is simpler and
# less surprising than teaching the dynamic finder a second include pattern for a source
# directory that isn't even physically inside `pantheon/` on disk.
[tool.setuptools]
packages = ["pantheon", "pantheon.agents"]

# Personas as installed package data — a Codex review finding on this port's own PR: a real,
# non-editable `pip`/`pipx` install of this package carried NO persona files at all before this
# fix (pyproject.toml packaged only `pantheon*`, but `pantheon.cli._agents_dir()` looked for
# `agents/` as a SIBLING of pantheon/'s own installed location — true for a dev checkout, never
# for a real site-packages install). `agents/` stays the single canonical source at the repo
# root (DESIGN.md rule 4 — install.sh, bootstrap.sh, and action.yml all still read it there
# directly, unaffected by this mapping); this entry
# additionally packages it AS `pantheon/agents/*.md` in the wheel, via a package-dir remap
# (`"pantheon.agents" = "agents"`) rather than physically relocating the source directory.
# `agents/__init__.py` (an empty marker, invisible to every non-Python consumer's `*.md` globs)
# is what makes setuptools treat it as a real package for this mapping to apply to.
# `pantheon.cli._agents_dir()` resolves it via `importlib.resources`, falling back to the
# dev-checkout sibling-directory layout when this package data isn't present (a raw checkout run
# via `PYTHONPATH`, or an install that predates this fix).
[tool.setuptools.package-dir]
"pantheon.agents" = "agents"

[tool.setuptools.package-data]
"pantheon.agents" = ["*.md"]

# --- Python quality gates -----------------------------------------------------------------
# Build-time-only tooling (ruff/mypy/pytest) — installed by CI, never a [project.dependencies]
# entry (the stdlib-only runtime constraint above is about the RUNTIME package, not the dev/CI
# toolchain that lints and tests it).

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# UP (pyupgrade) is scoped by target-version above to py39-safe suggestions only — this repo's
# floor is Python >=3.9 (section 1), so UP never proposes a 3.10+-only construct.

[tool.mypy]
# Checking-time target only — does NOT relax the package's own requires-python = ">=3.9" runtime
# floor above. Modern mypy (2.x, what CI installs) dropped `python_version` support below 3.10;
# "3.10" here is the lowest value mypy itself will still accept, not a claim that this package
# needs 3.10 at runtime — `from __future__ import annotations` (every module) plus ruff's own
# target-version = "py39" lint pass (which DOES enforce the real 3.9 floor, catching any 3.10+-
# only syntax/stdlib construct) are what actually keeps this package 3.9-compatible.
python_version = "3.10"
packages = ["pantheon"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
# Pragmatic-strict, not maximal-strict: no --strict (that would additionally require
# disallow_any_generics/disallow_subclassing_any/warn_return_any, none load-bearing for a
# stdlib-only CLI package this size) — the flags above are the ones that catch a real class of
# bug (an untyped def slipping past review, an unused ignore rotting stale) without demanding
# annotation ceremony this package's own contributor floor (bash 3.2+, no tooling assumed)
# doesn't otherwise ask for.

[tool.pytest.ini_options]
minversion = "7.0"
# Makes the repo root importable so a bare `pytest -q` — the command CONTRIBUTING.md documents —
# works on a FRESH CLONE with no `pip install -e .` first. `python -m pytest` happens to work
# without this (it injects cwd into sys.path); bare `pytest` does not, and CI never noticed
# because CI pip-installs the package two steps earlier. A first-time contributor following the
# docs top to bottom got 8 collection ImportErrors on unmodified `dev`. (pytest >= 7.0, already
# the declared minversion.)
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Deliberately narrow to tests/test_*.py (the pytest unit layer — jqjson matrix + pure-function
# seams only, see CONTRIBUTING.md's "Pytest unit layer" section for the scope policy) — the
# tests/test-*.sh black-box exam suites are a SEPARATE harness (plain bash, no pytest
# collection), never collected here.
